# \u5E94\u7528\u540D\u79F0
spring.application.name=MeetAssist

# \u76D1\u542C\u6240\u6709\u7F51\u7EDC\u63A5\u53E3
server.address=0.0.0.0

# \u6570\u636E\u5E93\u8BBE\u7F6E
server.port=8088
spring.datasource.url=jdbc:mysql://localhost:3306/meetassist?serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA \u914D\u7F6E
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# MyBatis \u914D\u7F6E
#mybatis.config-location=D:.\u684C\u9762.MeetAssist.src.main.resources.mybatis-config.xml  # \u6307\u5B9A MyBatis \u914D\u7F6E\u6587\u4EF6\u8DEF\u5F84
mybatis.mapper-locations=com.treemoon.MeetAssist.mapper/*.xml      # \u6307\u5B9A Mapper XML \u6587\u4EF6\u8DEF\u5F84
mybatis.type-aliases-package=com.treemoon.MeetAssist.pojo       # \u6307\u5B9A\u7C7B\u578B\u522B\u540D\u7684\u5305\u8DEF\u5F84

# \u8F6C\u5F55\u5927\u6A21\u578B\u8BBE\u7F6E
tingwu.accessKeyId=${ALIBABA_CLOUD_ACCESS_KEY_ID}
tingwu.accessKeySecret=${ALIBABA_CLOUD_ACCESS_KEY_SECRET}
tingwu.domain=tingwu.cn-beijing.aliyuncs.com
tingwu.version=2023-09-30
tingwu.region=cn-beijing
tingwu.appKey=8yEhsXWXp35lhPTm


#\u5B89\u6052\u5927\u6A21\u578B\u8BBE\u7F6E
anheng.appKey=${ANHENG_APP_KEY}
anheng.appSecret=${ANHENG_APP_SECRET}