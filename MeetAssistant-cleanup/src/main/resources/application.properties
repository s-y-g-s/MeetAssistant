spring.application.name=MeetAssistant-cleanup

server.address=0.0.0.0

server.port=8088
spring.datasource.url=jdbc:mysql://localhost:3306/meetassistant?serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view=false

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

mybatis.mapper-locations=com.treemoon.meetassistant.cleanup.mapper/*.xml
mybatis.type-aliases-package=com.treemoon.meetassistant.cleanup.pojo

tingwu.accessKeyId=${ALIBABA_CLOUD_ACCESS_KEY_ID}
tingwu.accessKeySecret=${ALIBABA_CLOUD_ACCESS_KEY_SECRET}
tingwu.domain=tingwu.cn-beijing.aliyuncs.com
tingwu.version=2023-09-30
tingwu.region=cn-beijing
tingwu.appKey=8yEhsXWXp35lhPTm

anheng.appKey=${ANHENG_APP_KEY}
anheng.appSecret=${ANHENG_APP_SECRET}